# Kamal 2 does not load .kamal/secrets into ENV before ERB runs.
# Load .env for local deploys; CI sets the same vars from GitHub Secrets.
<% root = Dir.pwd
   [ File.join(root, ".env"), File.join(root, ".kamal", "secrets") ].each do |path|
     next unless File.file?(path)

     IO.foreach(path, chomp: true) do |line|
       line = line.strip
       next if line.empty? || line.start_with?("#")
       line = line.sub(/\Aexport\s+/, "")
       key, value = line.split("=", 2)
       next unless key && value
       k = key.strip
       v = value.strip.gsub(/\A["']|["']\z/, "")
       ENV[k] = v if ENV[k].to_s.strip.empty?
     end
   end
%>
service: openwebui

image: <%= ENV["DOCKER_HUB_USER"] %>/openwebui

servers:
  web:
    hosts:
      - <%= ENV.fetch("DEPLOY_HOST") %>

proxy:
  ssl: true
  host: openwebui.surforders.com
  app_port: 8080
  healthcheck:
    path: /api/v1/health
    interval: 5
    timeout: 10

deploy_timeout: 300

registry:
  username: <%= ENV["DOCKER_HUB_USER"] %>
  password: <%= ENV["DOCKER_HUB_TOKEN"] %>

env:
  clear:
    # Kamal accessory DNS name is {service}-{accessory} on the kamal Docker network.
    DATABASE_TYPE: "postgresql"
    DATABASE_HOST: "openwebui-db"
    DATABASE_PORT: "5432"
    DATABASE_USER: "openwebui"
    DATABASE_PASSWORD: <%= ENV.fetch("POSTGRES_PASSWORD").dump %>
    DATABASE_NAME: "openwebui"
    OPENWEBUI_PORT: "8080"
  secret:
    - WEBUI_SECRET_KEY

volumes:
  - "openwebui-filestore:/app/backend/data"

accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("DEPLOY_HOST") %>
    network: kamal
    env:
      clear:
        POSTGRES_USER: openwebui
        POSTGRES_DB: openwebui
      secret:
        - POSTGRES_PASSWORD
    directories:
      - openwebui-postgres-data:/var/lib/postgresql/data

ssh:
  user: <%= ENV.fetch("DEPLOY_USER", "ubuntu") %>

builder:
  arch: amd64
