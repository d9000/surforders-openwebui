name: Smoke Test OpenWebUI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose config

      - name: Build smoke test image
        run: docker build -t surforders-openwebui:smoke .

      - name: Smoke test startup wrapper
        run: |
          database_url="$(docker run --rm \
            -e OPENWEBUI_START_WRAPPER_SELFTEST=1 \
            -e DATABASE_TYPE=postgresql \
            -e DATABASE_HOST=db \
            -e DATABASE_PORT=5432 \
            -e DATABASE_USER=openwebui \
            -e DATABASE_PASSWORD='p@ss:/word' \
            -e DATABASE_NAME=openwebui \
            surforders-openwebui:smoke)"
          expected_prefix='postgresql://openwebui:'
          expected_password='p%40ss%3A%2Fword'
          expected_suffix='@db:5432/openwebui'
          test "$database_url" = "${expected_prefix}${expected_password}${expected_suffix}"
