version: '3.8'

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    ports:
      - "8080:8080"
    environment:
      - OPENWEBUI_PORT=8080
      - DATABASE_URL=postgres://openwebui:openwebui_password@postgres:5432/openwebui
      - WEBUI_SECRET_KEY=your_random_secret_key
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - postgres
    networks:
      - openwebui-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: openwebui_postgres
    environment:
      - POSTGRES_USER=openwebui
      - POSTGRES_PASSWORD=openwebui_password
      - POSTGRES_DB=openwebui
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - openwebui-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Ollama service for local LLM models
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: openwebui_ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - openwebui-network

volumes:
  openwebui_data:
  postgres_data:
  # ollama_data:

networks:
  openwebui-network:
    driver: bridge
