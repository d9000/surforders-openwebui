services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openwebui}
      POSTGRES_DB: openwebui
    volumes:
      - openwebui-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui"]
      interval: 5s
      timeout: 5s
      retries: 10

  openwebui:
    build:
      context: .
    image: surforders-openwebui:local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_TYPE: "postgresql"
      DATABASE_HOST: "db"
      DATABASE_PORT: "5432"
      DATABASE_USER: "openwebui"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:-openwebui}"
      DATABASE_NAME: "openwebui"
      OPENWEBUI_PORT: "8080"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-dev-secret-key-change-me}"
    volumes:
      - openwebui-filestore:/app/backend/data

volumes:
  openwebui-db-data:
  openwebui-filestore:
