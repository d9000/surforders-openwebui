services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openwebui}
      POSTGRES_DB: openwebui
    volumes:
      - openwebui-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui"]
      interval: 5s
      timeout: 5s
      retries: 10

  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://openwebui:${POSTGRES_PASSWORD:-openwebui}@db:5432/openwebui"
      OPENWEBUI_PORT: "8080"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-dev-secret-key-change-me}"
    volumes:
      - openwebui-filestore:/app/backend/data

volumes:
  openwebui-db-data:
  openwebui-filestore:
